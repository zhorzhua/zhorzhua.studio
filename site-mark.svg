<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Zhorzhua Studio</title>
  <desc id="desc">Two mirrored letter Z forms fused into an hourglass.</desc>
  <defs>
    <linearGradient id="ribbon" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b49ab5"/>
      <stop offset=".36" stop-color="#8fa6c3"/>
      <stop offset=".70" stop-color="#c9826c"/>
      <stop offset="1" stop-color="#d9a16f"/>
    </linearGradient>
  </defs>
  <!-- One unbroken ribbon: a Z and its mirror sharing both horizontal rails. -->
  <path d="M20 24H108L20 104H108L20 24"
        fill="none" stroke="url(#ribbon)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
