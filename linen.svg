<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="linen" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.32" numOctaves="3" seed="17" stitchTiles="stitch" result="warp"/>
    <feColorMatrix in="warp" type="saturate" values="0" result="warpGray"/>
    <feComponentTransfer in="warpGray" result="warpSoft">
      <feFuncR type="linear" slope="0.72" intercept="0.14"/>
      <feFuncG type="linear" slope="0.72" intercept="0.14"/>
      <feFuncB type="linear" slope="0.72" intercept="0.14"/>
    </feComponentTransfer>

    <feTurbulence type="fractalNoise" baseFrequency="0.26 0.021" numOctaves="3" seed="31" stitchTiles="stitch" result="weft"/>
    <feColorMatrix in="weft" type="saturate" values="0" result="weftGray"/>
    <feComponentTransfer in="weftGray" result="weftSoft">
      <feFuncR type="linear" slope="0.56" intercept="0.22"/>
      <feFuncG type="linear" slope="0.56" intercept="0.22"/>
      <feFuncB type="linear" slope="0.56" intercept="0.22"/>
    </feComponentTransfer>

    <feBlend in="warpSoft" in2="weftSoft" mode="multiply" result="woven"/>
    <feComponentTransfer in="woven">
      <feFuncR type="linear" slope="1.55" intercept="0.10"/>
      <feFuncG type="linear" slope="1.55" intercept="0.10"/>
      <feFuncB type="linear" slope="1.55" intercept="0.10"/>
    </feComponentTransfer>
  </filter>
  <rect width="320" height="320" fill="#808080" filter="url(#linen)"/>
</svg>
