      <stop stop-color="#1d3035"/>
      <stop offset="1" stop-color="#111416"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
